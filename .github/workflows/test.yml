name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# A superseded run tells you nothing, and this is five runners deep.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The action picks its archive from the runner's own OS and architecture, so
  # a wrong guess shows up only on the platform that has it. Every combination
  # the release publishes for is covered here except darwin/amd64: macos-13 is
  # the Intel image and failed to get a runner on two consecutive attempts, so
  # a job that never starts was reporting nothing while looking like coverage.
  # That one case differs from macos-latest only in the architecture the
  # archive name carries.
  install:
    name: ${{ matrix.runner }}, ${{ matrix.version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        version: [latest]
        include:
          # A pinned version resolves differently from latest, so it is worth
          # one run of its own rather than trusting that both paths work.
          - runner: ubuntu-latest
            version: v0.2.0
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: The binary runs and is the version the action reported
        shell: bash
        run: |
          set -euo pipefail
          got="$(archdoc --version)"
          echo "reported ${{ steps.setup.outputs.version }}, binary says $got"
          [ "$got" = "${{ steps.setup.outputs.version }}" ]

      - name: And it works on a repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spec" && cd "$RUNNER_TEMP/spec"
          git init -q .
          archdoc init --name Test --no-interaction
          archdoc lint
          archdoc index --check

  # The README tells people to write archdochq/setup@v1, which resolves the
  # action from the tag rather than from this checkout. Same code, different
  # resolution path, and it is the form everyone actually uses.
  tagged:
    name: as archdochq/setup@v1
    runs-on: ubuntu-latest
    steps:
      - uses: archdochq/setup@v1
      - shell: bash
        run: archdoc --version
